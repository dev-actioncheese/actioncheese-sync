[project]
name = "syncmyvids"
version = "0.1.0"
description = "Waveform-based multicam timeline sync for FCP7 XML (xmeml) timelines"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel", email = "contact@actioncheese.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
actioncheese-sync = "syncmyvids.cli:main"
# Kept so existing scripts and muscle memory keep working.
syncmyvids = "syncmyvids.cli:main"

[project.gui-scripts]
actioncheese-sync-gui = "syncmyvids.gui:main"
syncmyvids-gui = "syncmyvids.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncmyvids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "slow: end-to-end tests that generate media and run the full pipeline",
]
